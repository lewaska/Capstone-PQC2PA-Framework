[package]
name = "pqc2pa-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
c2pa = {
    version = "0.91.2",
    default-features = false,
    features = ["file_io", "rust_native_crypto"]
}
clap = { version = "4.5", features = ["derive"] }
coset = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"